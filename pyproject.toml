[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "water-anomaly-agent"
version = "0.1.0"
description = "水域综合异常识别行业智能体"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "gradio>=5,<6",
  "httpx>=0.27,<1",
  "langchain-openai>=0.3,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "ultralytics>=8.3,<9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
water-agent = "water_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/water_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
